spring:
  application:
    name: url-shortener
  datasource:
    url: jdbc:postgresql://localhost:5433/shortener
    username: shortener
    password: shortener
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 200
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 32
          max-idle: 16

server:
  port: 8080

shortener:
  base-url: "http://short.ly"
  snowflake:
    worker-id: 1
  cache:
    ttl-seconds: 3600
    bloom:
      expected-insertions: 50000000
      false-positive-rate: 0.01
  rate-limit:
    create:
      capacity: 20
      refill-tokens: 20
      refill-period-seconds: 60
    redirect:
      capacity: 100
      refill-tokens: 100
      refill-period-seconds: 1
  analytics:
    stream-key: "click_events_stream"
    consumer-group: "analytics_workers"
    batch-size: 500
    batch-timeout-ms: 200
    consumer-threads: 2

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
